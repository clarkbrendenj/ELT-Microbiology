version: 2

models:
  - name: int_susceptibility_reconciliation
    description: >
      Reconciles repeated susceptibility source records at the
      culture-organism-antibiotic grain and classifies each group as
      resolved, missing, or conflicting.

    columns:
      - name: culture_organism_key
        data_tests:
          - not_null

      - name: antibiotic
        data_tests:
          - not_null

      - name: resolution_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - resolved
                  - missing
                  - conflict

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - culture_organism_key
              - antibiotic

  - name: int_cohort_culture_organism
    description: >
      Assigns each culture-organism combination to an explicitly
      defined microbiology culture cohort based on the source
      culture_description.

    columns:
      - name: culture_organism_key
        data_tests:
          - not_null

      - name: culture_key
        data_tests:
          - not_null

      - name: patient_key
        data_tests:
          - not_null

      - name: organism
        data_tests:
          - not_null

      - name: cohort_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - blood
                  - urine
                  - respiratory

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - culture_organism_key
              - cohort_id

  - name: int_mapped_cohort_culture_organism
    description: >
      Culture-organism cohort memberships enriched with reviewed organism
      terminology mappings. Source organism labels are preserved.

    columns:
      - name: culture_organism_key
        data_tests:
          - not_null

      - name: organism_source_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_organism')
                field: organism_source_key

      - name: organism_source
        data_tests:
          - not_null

      - name: cohort_id
        data_tests:
          - not_null

      - name: mapping_status
        data_tests:
          - not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - culture_organism_key
              - cohort_id

  - name: int_culture_organism_phenotype
    description: >
      One row per source culture-organism record with AST-derived resistance
      phenotype classifications. CRE, extended-spectrum cephalosporin-resistant
      Enterobacterales, oxacillin-resistant Staphylococcus aureus,
      vancomycin-resistant Enterococcus, and MDR Pseudomonas aeruginosa are
      evaluated before patient-level deduplication. Source phenotype
      designations are retained only as provenance.

    columns:
      - name: culture_organism_key
        data_tests:
          - not_null
          - unique
          - relationships:
              arguments:
                to: ref('int_mapped_cohort_culture_organism')
                field: culture_organism_key

      - name: cohort_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - blood
                  - urine
                  - respiratory

      - name: ast_cre_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [positive, not_detected, not_evaluable, not_applicable]

      - name: ast_esce_enterobacterales_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [positive, not_detected, not_evaluable, not_applicable]

      - name: ast_oxacillin_resistance_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [positive, not_detected, not_evaluable, not_applicable]

      - name: ast_vancomycin_resistance_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [positive, not_detected, not_evaluable, not_applicable]

      - name: ast_mdr_p_aeruginosa_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [positive, not_detected, not_evaluable, not_applicable]

  - name: int_reporting_culture_organism
    description: >
      Phenotype-aware culture-level reporting records. Reviewed source organism
      records that belong to the same culture, reporting group, and reporting
      phenotype are safely consolidated after phenotype assignment while all
      contributing source culture-organism keys are retained for downstream
      susceptibility reconciliation. The internal 'base' reporting phenotype
      is not the overall antibiogram population; the overall first-culture
      model combines phenotype records before selecting the earliest culture.

    columns:
      - name: reporting_culture_organism_key
        data_tests:
          - not_null
          - unique

      - name: culture_key
        data_tests:
          - not_null

      - name: patient_key
        data_tests:
          - not_null

      - name: cohort_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - blood
                  - urine
                  - respiratory

      - name: organism_reporting_group
        data_tests:
          - not_null

      - name: organism_name
        data_tests:
          - not_null

      - name: reporting_phenotype
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - base
                  - cre
                  - esce_r
                  - mdr_p_aeruginosa
                  - oxacillin_resistant
                  - vancomycin_resistant

      - name: source_organism_record_count
        data_tests:
          - not_null
