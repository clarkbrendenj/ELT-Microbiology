version: 2

models:
  - name: fct_culture
    description: >
      One row per microbiology culture order in the analyzed ARMD release.

    columns:
      - name: culture_key
        description: >
          Project-generated unique identifier for a culture order within
          an ARMD dataset release.
        data_tests:
          - not_null
          - unique

      - name: source_version
        data_tests:
          - not_null

      - name: patient_key
        data_tests:
          - not_null

      - name: encounter_key
        data_tests:
          - not_null

      - name: culture_order_key
        data_tests:
          - not_null

      - name: was_positive
        data_tests:
          - accepted_values:
              arguments:
                values: [0, 1]

  - name: fct_culture_organism
    description: >
      One row per culture-organism combination. Cultures without an
      identified organism remain represented in fct_culture but do not
      appear in this model. The source does not provide a verified isolate
      identifier, so repeated isolates of the same organism cannot be
      independently distinguished.

    columns:
      - name: culture_organism_key
        data_tests:
          - not_null
          - unique

      - name: culture_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_culture')
                field: culture_key

      - name: organism
        data_tests:
          - not_null

      - name: source_version
        data_tests:
          - not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - culture_key
              - organism                
  
  - name: fct_susceptibility
    description: >
      One row per unambiguous culture-organism-antibiotic susceptibility
      result. Groups containing conflicting or missing source-result states
      are retained separately in the susceptibility exception model.

    columns:
      - name: susceptibility_key
        data_tests:
          - not_null
          - unique

      - name: culture_organism_key
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('fct_culture_organism')
                field: culture_organism_key

      - name: antibiotic
        data_tests:
          - not_null

      - name: susceptibility
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - Susceptible
                  - Resistant
                  - Intermediate
                  - Inconclusive
                  - Synergism

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - culture_organism_key
              - antibiotic                

  - name: dim_organism
    description: >
      Version-controlled project mapping from ARMD source organism labels
      to reviewed organism identities and reporting groups. The standardized
      identity preserves the reviewed organism identity, while the reporting
      group controls grouping for downstream susceptibility reporting.
      Source qualifiers are preserved separately from organism identity.
      Unreviewed source labels remain visible and are explicitly marked as
      unmapped.

    columns:
      - name: organism_source_key
        description: >
          Project-generated identifier for the exact ARMD source organism
          label.
        data_tests:
          - not_null
          - unique

      - name: organism_source
        description: >
          Exact organism label as represented in the ARMD source.
        data_tests:
          - not_null
          - unique

      - name: organism_standardized
        description: >
          Reviewed organism identity corresponding to the ARMD source label.
          Phenotype and morphotype qualifiers are not appended to this field.
        data_tests:
          - not_null:
              config:
                where: "mapping_status = 'reviewed'"

      - name: organism_reporting_group
        description: >
          Reviewed organism group used for downstream susceptibility
          reporting and phenotype-aware patient-level deduplication. This may
          differ from organism_standardized when multiple organism identities
          are intentionally combined into a reporting complex.
        data_tests:
          - not_null:
              config:
                where: "mapping_status = 'reviewed'"

      - name: source_qualifier
        description: >
          Source-system qualifier preserved separately from organism
          identity, such as MRSA, carbapenem resistance, mucoid morphology,
          or other reviewed source terminology.

      - name: include_primary_summary
        description: >
          Indicates whether the reviewed organism mapping is eligible for
          downstream primary susceptibility reporting before phenotype-level
          inclusion and exclusion rules are applied.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: mapping_status
        description: >
          Indicates whether the ARMD source organism label has a reviewed
          project mapping.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - reviewed
                  - unmapped

      - name: has_reviewed_mapping
        description: >
          Boolean indicator that a reviewed organism mapping exists for the
          source label.
        data_tests:
          - not_null