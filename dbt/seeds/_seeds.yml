version: 2

seeds:
  - name: reportable_organism_antibiotic_pairs
    description: >
      Explicitly reviewed base organism reporting-group and antibiotic pairs
      used by the susceptibility reporting mart. Inclusion is a project
      reporting decision and does not imply clinical guideline endorsement.

    columns:
      - name: organism_reporting_group
        data_tests:
          - not_null

      - name: antibiotic
        data_tests:
          - not_null

      - name: pair_order
        data_tests:
          - not_null

      - name: include_primary_dashboard
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: review_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - reviewed

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - organism_reporting_group
              - antibiotic
  - name: organism_antibiotic_exclusions
    description: >
      Reviewed organism-antibiotic combinations excluded from the
      susceptibility reporting mart. Exclusions include expected resistant
      phenotypes and project reporting suppressions intended to produce a
      clinically meaningful summary antibiogram.

    columns:
      - name: organism_reporting_group
        data_tests:
          - not_null

      - name: antibiotic
        data_tests:
          - not_null

      - name: exclusion_reason
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - expected_resistant
                  - ampc_reporting_suppression

      - name: review_basis
        data_tests:
          - not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - organism_reporting_group
              - antibiotic
  
  - name: organism_reporting_groups
    description: >
      Reference table for organism-level reporting attributes used by
      the final susceptibility and MDRO marts.

    columns:
      - name: organism_reporting_group
        data_tests:
          - not_null
          - unique

      - name: gram_stain_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - gram_positive
                  - gram_negative              