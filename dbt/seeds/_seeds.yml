version: 2

seeds:
  - name: reportable_organism_antibiotic_pairs
    description: >
      Explicitly reviewed base organism reporting-group and antibiotic pairs
      used by the susceptibility reporting mart. Inclusion is a project
      reporting decision and does not imply clinical guideline endorsement.

    columns:
      - name: organism_reporting_group
        data_tests:
          - not_null

      - name: antibiotic
        data_tests:
          - not_null

      - name: pair_order
        data_tests:
          - not_null

      - name: include_primary_dashboard
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [0, 1]

      - name: review_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - reviewed
                  - proposed
      - name: cohort_id
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - blood
                  - respiratory
                  - urine

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - organism_reporting_group
              - cohort_id
              - antibiotic
  
  - name: organism_antibiotic_exclusions
    description: >
      Reviewed organism-antibiotic exclusions, optionally scoped to a cohort
      and reporting phenotype. An asterisk in either scope column matches all
      values of that dimension. Rules suppress reporting-grid rows before AST
      aggregation without changing source evidence or phenotype selection.

    columns:
      - name: organism_reporting_group
        data_tests:
          - not_null

      - name: antibiotic
        data_tests:
          - not_null

      - name: cohort_id
        description: Specimen cohort to exclude, or '*' for every cohort.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['*', blood, respiratory, urine]

      - name: reporting_phenotype
        description: Reporting category to exclude, or '*' for every category.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - '*'
                  - base
                  - esce_r
                  - overall
                  - oxacillin_resistant
                  - oxacillin_susceptible
                  - vancomycin_resistant

      - name: exclusion_reason
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - expected_resistant
                  - ampc_reporting_suppression
                  - inappropriate_surrogate
                  - no_current_breakpoint
                  - phenotype_reporting_suppression
                  - source_category_limitation
                  - project_panel_exclusion

      - name: review_basis
        data_tests:
          - not_null

    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - organism_reporting_group
              - cohort_id
              - reporting_phenotype
              - antibiotic
  
  - name: organism_reporting_groups
    description: >
      Reference table for organism-level reporting attributes used by
      the final susceptibility and MDRO marts.

    columns:
      - name: organism_reporting_group
        data_tests:
          - not_null
          - unique

      - name: gram_stain_group
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - gram_positive
                  - gram_negative              